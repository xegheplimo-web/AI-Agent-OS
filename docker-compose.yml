# ---------------------------------------------------------------------------
# Profiles keep the two execution models from ever overlapping:
#
#   docker compose --profile demo up --build
#     → migrate → seed → dashboard(APP_MODE=demo). NO worker: the demo engine
#       advances inline and a second engine would race it.
#
#   docker compose --profile production up --build
#     → migrate → dashboard(enqueue only) + worker(real auditor engine).
#
#   docker compose --profile cache up -d redis     (optional, see README)
#
# `migrate` runs drizzle-kit push against the SAME DATABASE_URL the app uses
# and must exit 0 before the dashboard starts — otherwise the app boots
# against an empty database and every query 500s.
# ---------------------------------------------------------------------------
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: agent_os
      POSTGRES_PASSWORD: agent_os
      POSTGRES_DB: agent_os
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_os -d agent_os"]
      interval: 5s
      timeout: 3s
      retries: 12
    profiles: ["demo", "production"]

  # --- schema bootstrap (runs once, both profiles) --------------------------
  # Uses a custom migration runner (scripts/migrate.ts) instead of
  # `drizzle-kit migrate` (which has a silent-fail bug on PostgreSQL 17:
  # applies 0 migrations, exits 1, no error) or `drizzle-kit push --force`
  # (which bypasses the ledger and can silently drift the schema).
  # The runner applies SQL files from ./drizzle/ in order and records each
  # in the __drizzle_migrations ledger — ordered, auditable, reproducible.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node_modules/.bin/tsx", "scripts/migrate.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://agent_os:agent_os@postgres:5432/agent_os
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["demo", "production"]

  # --- demo data (demo profile only) ---------------------------------------
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node_modules/.bin/tsx", "src/db/seed.ts"]
    environment:
      NODE_ENV: production
      APP_MODE: demo
      DATABASE_URL: postgresql://agent_os:agent_os@postgres:5432/agent_os
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    profiles: ["demo"]

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    profiles: ["cache"]

  dashboard-demo:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      APP_MODE: demo
      NEXT_PUBLIC_APP_MODE: demo
      DATABASE_URL: postgresql://agent_os:agent_os@postgres:5432/agent_os
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:?set via env or .env file}
      SESSION_SECRET: ${SESSION_SECRET:?set via env or .env file}
    ports:
      - "3000:3000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    profiles: ["demo"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      APP_MODE: production
      NEXT_PUBLIC_APP_MODE: production
      DATABASE_URL: postgresql://agent_os:agent_os@postgres:5432/agent_os
      AUDITOR_SERVICE_TOKEN: ${AUDITOR_SERVICE_TOKEN:?set via env or .env file}
      WORKER_SERVICE_TOKEN: ${WORKER_SERVICE_TOKEN:?set via env or .env file}
      SESSION_SECRET: ${SESSION_SECRET:?set via env or .env file}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    profiles: ["production"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node_modules/.bin/tsx", "src/worker/index.ts"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_MODE: production
      DATABASE_URL: postgresql://agent_os:agent_os@postgres:5432/agent_os
      WORKER_SERVICE_TOKEN: ${WORKER_SERVICE_TOKEN:?set via env or .env file}
      # Production audit target — the worker scans THIS root, not its own
      # checkout. Without it, resolveTarget() marks the target invalid and
      # every root-backed scanner fail-closes (no false-green on worker's
      # own node_modules). Mount the target read-only below.
      AUDIT_TARGET_ROOT_PRODUCTION: ${AUDIT_TARGET_ROOT_PRODUCTION:-/audit-target}
      TARGET_DATABASE_URL_PRODUCTION: ${TARGET_DATABASE_URL_PRODUCTION:-}
      TARGET_RUNTIME_ENDPOINT_PRODUCTION: ${TARGET_RUNTIME_ENDPOINT_PRODUCTION:-}
    volumes:
      # Mount the audit target repository read-only so the worker can scan
      # it but never modify it. The host path is configurable via env or
      # .env file; default is a named volume for smoke testing.
      - ${AUDIT_TARGET_HOST_PATH:-audit-target-data}:/audit-target:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Multiple replicas are safe: jobs are claimed FOR UPDATE SKIP LOCKED
    # and each audit belongs to exactly one claimed job. The worker heartbeats;
    # if it crashes, `restart: unless-stopped` + requeueStaleJobs() recover it.
    deploy:
      replicas: 1
    profiles: ["production"]

volumes:
  postgres-data:
  # Default target volume for smoke testing. In production, set
  # AUDIT_TARGET_HOST_PATH in .env to the host path of the repository
  # you want to audit (e.g. /home/repos/my-app).
  audit-target-data:
