[package]
name = "ai-agent-os"
version = "0.1.0"
description = "AI Agent OS — desktop shell for the control plane"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Note: shell features (sidecar, open) are provided by tauri-plugin-shell,
# NOT by tauri core features. This is a Tauri 2 change from Tauri 1.

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
